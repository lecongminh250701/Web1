<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        내 명함
    </title>

    <style>
        body {
            /*배경색을 내가 좋아하는 색으로 바꿔보세요! */
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .my-card {
            background-color: white;
            width: 400px;
            padding: 40px 30px;
            border-radius: 5px 5px 15px rgba(0,0,0,0,2);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        .job {
            color: #3498db;
            font-weight: bold;
        }
    </style>
</head>


<body>

    <!-- 명함 내용 -->

    <div class="my-card">

        <h1>이름: 원피 (Webber)</h1>

        <p class="job">🙋 예비 프론트엔드 개발자</p>

        <p>코딩으로 세상을 바꾸고 싶어요!</p>

        <p>이메일: webber@hello.com</p>

    </div>

</body>

</html>
