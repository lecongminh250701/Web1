<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
      table {
            /* 1. Thiết lập viền bự ở ngoài (độ dày 2px, nét liền solid, màu đen #000) */
            border: 2px solid #000;
            
            /* Gộp các đường viền lại để không bị khoảng hở */
            border-collapse: collapse; 
            width: 100%;
            max-width: 500px; 
            Giới hạn chiều rộng bảng cho đẹp
        }

th, td {
            border: none; 
            /* padding: 8px 12px; Thêm khoảng cách đệm cho chữ dễ đọc */
            text-align: middle;
        }

    </style>
</head>  
<body>
    <h1>1학년 신입생(Lv.1)</h1>
    <h2>현재 능력치</h2>
    <table>
        <thead>
            <tr>
                <th>능력치</th>
                <th>수치</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody>
              <tr>
                <td>채력(HP)</td>
                <td>100/100</td>
                <td>쌩쌩함</td>
              </tr>
              <tr>
                <td>코딩려(INT)</td>
                <td>10</td>
                <td>성장 중</td>
              </tr>
              <tr>
                <td>수면욕(SLP)</td>
                <td>999</td>
                <td>위험</td>
              </tr>
              <tr>
                <td>현재 버프:'아이스 아메리카노' 복용 (집중력 +20%)</td>
              </tr>
        </tbody>
    </table>
    <h2>오늘의 퀘스트</h2>
    <ol>
        <li>웹프로그래밍 수업 지각하지 않기</li>
        <li>HTML 테이블 태크 완벽히 이해하기</li>
        <li>학식 메뉴 성공적으로 고르기</li>
    </ol>
    <h2>인벤토리 보유 아이템</h2>
    <ul>    
        <li>전공 서적 (무게: 5kg)</li>
        <li>다 쓴 볼펜 1자루</li>
        <li>먹다 남은 젤리</li>
        <li>충전 안 된 무선 이어폰</li>
    </ul>
</body>
</html>
