<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>1학년 신입생</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { font-size: 36px; }
    h2 { margin-top: 35px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #555; padding: 12px; text-align: center; }
    th { background: #f2f2f2; }
    li { margin: 10px 0; font-size: 18px; }
  </style>
</head>
<body>

  <h1>🧙 1학년 신입생 (Lv. 1)</h1>

  <h2>📊 현재 능력치</h2>
  <table>
    <tr>
      <th>능력치</th>
      <th>수치</th>
      <th>상태</th>
    </tr>
    <tr>
      <td>체력 (HP)</td>
      <td>100 / 100</td>
      <td>쌩쌩함</td>
    </tr>
    <tr>
      <td>코딩력 (INT)</td>
      <td>10</td>
      <td>성장 중</td>
    </tr>
    <tr>
      <td>수면욕 (SLP)</td>
      <td>999</td>
      <td>위험</td>
    </tr>
  </table>

  <h2>📜 오늘의 퀘스트</h2>
  <ol>
    <li>웹 프로그래밍 수업 지각하지 않기</li>
    <li>HTML 테이블 태그 완벽히 이해하기</li>
    <li>학식 메뉴 성공적으로 고르기</li>
  </ol>

  <h2>🎒 보유 아이템</h2>
  <ul>
    <li>전공 서적 (무게: 5kg)</li>
    <li>다 쓴 볼펜 1자루</li>
    <li>먹다 남은 젤리</li>
    <li>충전 안 된 무선 이어폰</li>
  </ul>

</body>
</html>
