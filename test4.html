<!DOCTYPE html>
<html>
<head>
    <title> CSS3 Font Property</title>
    <style>
       li{
        list-style-type: none;
       }
       #v_menu{
        width: 150px;
       }
       #h_menu{
        display: inline;
       }
       .menus{
        margin: 0 20px 0 20px;
        color: green;
       }
    </style>
</head>
<body>
    <h3>1. 세로 메뉴</h3>
    <ul id="v_menu">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>

    <h3>2.가로 메뉴</h3>
    <ul id="h_menu">
        <li class="menus">5</li>
        <li>6</li>
        <li class="menus">7</li>
        <li>8</li>
        <li class="menus">9</li>

    </ul>
</body>
</html>
